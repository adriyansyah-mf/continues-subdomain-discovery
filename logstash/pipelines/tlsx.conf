# Pipeline "tlsx": Redis list bb:events:tlsx -> validate -> bb-tls, bb-tlsx-raw
# Generated layout is identical across pipelines except the input key and the
# index allow-list (must match PIPELINE_INDICES in app/services/events.py).
input {
  redis {
    host => "${REDIS_HOST:redis}"
    port => 6379
    password => "${REDIS_PASSWORD}"
    data_type => "list"
    key => "bb:events:tlsx"
    codec => json
    batch_count => 125
    threads => 1
  }
}

filter {
  # 1. parse: the json codec tags unparseable payloads with _jsonparsefailure
  if "_jsonparsefailure" in [tags] or "_timestampparsefailure" in [tags] {
    mutate {
      add_field => { "[@metadata][index]" => "bb-errors" "[error][type]" => "MALFORMED_EVENT" }
      rename => { "message" => "[error][message]" }
    }
  }
  # 2. validate required fields of the unified schema
  else if ![bb][index] or ![event][type] or ![event][kind] {
    mutate { add_field => { "[@metadata][index]" => "bb-errors" "[error][type]" => "MISSING_REQUIRED_FIELD" } }
  }
  # 3. route: only indices this pipeline owns (anchored regex: Logstash treats a
  #    single-element `in ["x"]` list as a string, so `in` is not used here)
  else if [bb][index] =~ /^(bb-tls|bb-tlsx-raw)$/ {
    mutate { copy => { "[bb][index]" => "[@metadata][index]" } }
  }
  else {
    mutate { add_field => { "[@metadata][index]" => "bb-errors" "[error][type]" => "INDEX_NOT_ALLOWED" } }
  }

  if [bb][doc_id] {
    mutate { copy => { "[bb][doc_id]" => "[@metadata][doc_id]" } remove_field => ["[bb][doc_id]"] }
  }
  # 4. enrich: ingestion timestamp + pipeline name
  ruby { code => "event.set('[event][ingested]', LogStash::Timestamp.now)" }
  mutate { add_field => { "[event][pipeline]" => "tlsx" } }
}

output {
  if [@metadata][doc_id] {
    # current-state documents (e.g. jobs) are upserted by id within the monthly index
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
      user => "${LOGSTASH_WRITER_USER:logstash_writer}"
      password => "${LOGSTASH_WRITER_PASSWORD}"
      index => "%{[@metadata][index]}-%{+YYYY.MM}"
      document_id => "%{[@metadata][doc_id]}"
      action => "index"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
  } else {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
      user => "${LOGSTASH_WRITER_USER:logstash_writer}"
      password => "${LOGSTASH_WRITER_PASSWORD}"
      index => "%{[@metadata][index]}-%{+YYYY.MM}"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
  }
}
