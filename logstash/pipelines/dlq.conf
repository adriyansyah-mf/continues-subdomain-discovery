# Dead-letter pipeline: events Elasticsearch rejected (e.g. mapping conflicts)
# are re-indexed into bb-errors-* with the rejection reason, then committed.
input {
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "assets"
    commit_offsets => true
    tags => ["dlq_assets"]
  }
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "certstream"
    commit_offsets => true
    tags => ["dlq_certstream"]
  }
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "tlsx"
    commit_offsets => true
    tags => ["dlq_tlsx"]
  }
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "httpx"
    commit_offsets => true
    tags => ["dlq_httpx"]
  }
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "dns"
    commit_offsets => true
    tags => ["dlq_dns"]
  }
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "katana"
    commit_offsets => true
    tags => ["dlq_katana"]
  }
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "nuclei"
    commit_offsets => true
    tags => ["dlq_nuclei"]
  }
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "bbot"
    commit_offsets => true
    tags => ["dlq_bbot"]
  }
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "cve"
    commit_offsets => true
    tags => ["dlq_cve"]
  }
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "changes"
    commit_offsets => true
    tags => ["dlq_changes"]
  }
  dead_letter_queue {
    path => "/usr/share/logstash/data/dead_letter_queue"
    pipeline_id => "ops"
    commit_offsets => true
    tags => ["dlq_ops"]
  }
}

filter {
  mutate {
    add_field => {
      "[error][type]" => "ELASTICSEARCH_REJECTED"
      "[error][message]" => "%{[@metadata][dead_letter_queue][reason]}"
      "[event][kind]" => "pipeline_error"
      "[event][type]" => "DLQ_EVENT"
      "[event][pipeline]" => "%{[@metadata][dead_letter_queue][pipeline_id]}"
    }
  }
  # keep the original payload un-indexed (bb-base maps `raw` as flattened)
  ruby {
    code => "
      orig = event.to_hash.reject { |k, _| ['@timestamp', '@version', 'error', 'event', 'tags'].include?(k) }
      orig.keys.each { |k| event.remove(k) }
      event.set('raw', { 'original' => orig.to_s[0, 8000] })
    "
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
    user => "${LOGSTASH_WRITER_USER:logstash_writer}"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    index => "bb-errors-%{+YYYY.MM}"
    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}
