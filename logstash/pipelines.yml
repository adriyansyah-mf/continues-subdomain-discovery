# One pipeline per event stream (no giant shared config). Each reads its own Redis list.
- pipeline.id: assets
  path.config: "/usr/share/logstash/pipeline/assets.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
- pipeline.id: certstream
  path.config: "/usr/share/logstash/pipeline/certstream.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
- pipeline.id: tlsx
  path.config: "/usr/share/logstash/pipeline/tlsx.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
- pipeline.id: httpx
  path.config: "/usr/share/logstash/pipeline/httpx.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
- pipeline.id: dns
  path.config: "/usr/share/logstash/pipeline/dns.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
- pipeline.id: katana
  path.config: "/usr/share/logstash/pipeline/katana.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
- pipeline.id: nuclei
  path.config: "/usr/share/logstash/pipeline/nuclei.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
- pipeline.id: bbot
  path.config: "/usr/share/logstash/pipeline/bbot.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
- pipeline.id: cve
  path.config: "/usr/share/logstash/pipeline/cve.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
- pipeline.id: changes
  path.config: "/usr/share/logstash/pipeline/changes.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
- pipeline.id: ops
  path.config: "/usr/share/logstash/pipeline/ops.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
- pipeline.id: dlq
  path.config: "/usr/share/logstash/pipeline/dlq.conf"
  pipeline.workers: 1
  pipeline.batch.size: 125
  dead_letter_queue.enable: false
