# Bug bounty asset intelligence platform - core stack.
#   docker compose up -d                          # core platform
#   docker compose -f compose.yaml -f compose.dev.yaml up -d   # + local lab target / exposed DB ports
# All host ports bind to 127.0.0.1 only. Image versions are pinned in .env.
name: bugbounty

x-platform-env: &platform-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  BB_ENVIRONMENT: ${BB_ENVIRONMENT:-development}
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  ELASTICSEARCH_URL: http://elasticsearch:9200
  ES_MONITOR_USER: bb_monitor
  ES_MONITOR_PASSWORD: ${ES_MONITOR_PASSWORD}
  CERTSTREAM_URL: ${CERTSTREAM_URL}
  CERTSTREAM_STORE_OUT_OF_SCOPE: ${CERTSTREAM_STORE_OUT_OF_SCOPE:-false}
  CERTSTREAM_FOLLOWUP_SCANNERS: ${CERTSTREAM_FOLLOWUP_SCANNERS:-dns}
  CERTSTREAM_IDLE_TIMEOUT: ${CERTSTREAM_IDLE_TIMEOUT:-300}
  BOUNTY_TARGETS_URL: ${BOUNTY_TARGETS_URL}
  IPRANGES_REPO: ${IPRANGES_REPO}
  IPRANGES_SYNC_INTERVAL: ${IPRANGES_SYNC_INTERVAL:-86400}
  ASN_FEED_URL: ${ASN_FEED_URL:-https://iptoasn.com/data/ip2asn-combined.tsv.gz}
  ASN_SYNC_INTERVAL: ${ASN_SYNC_INTERVAL:-86400}
  KEV_FEED_URL: ${KEV_FEED_URL}
  EPSS_FEED_URL: ${EPSS_FEED_URL:-https://epss.empiricalsecurity.com/epss_scores-current.csv.gz}
  KEV_SYNC_INTERVAL: ${KEV_SYNC_INTERVAL:-21600}
  EPSS_SYNC_INTERVAL: ${EPSS_SYNC_INTERVAL:-86400}
  CVE_CORRELATION_INTERVAL: ${CVE_CORRELATION_INTERVAL:-86400}
  HTTPX_RATE_LIMIT: ${HTTPX_RATE_LIMIT:-20}
  TLSX_RATE_LIMIT: ${TLSX_RATE_LIMIT:-20}
  NUCLEI_RATE_LIMIT: ${NUCLEI_RATE_LIMIT:-10}
  KATANA_RATE_LIMIT: ${KATANA_RATE_LIMIT:-10}
  BBOT_RATE_LIMIT: ${BBOT_RATE_LIMIT:-10}
  MAX_CONCURRENCY: ${MAX_CONCURRENCY:-4}
  MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-4}
  PROGRAM_MAX_CONCURRENT: ${PROGRAM_MAX_CONCURRENT:-8}
  PER_HOST_MAX_CONCURRENT: ${PER_HOST_MAX_CONCURRENT:-1}
  DISPATCH_MAX_QUEUED_PER_PROGRAM: ${DISPATCH_MAX_QUEUED_PER_PROGRAM:-25}
  MAX_CIDR_SIZE: ${MAX_CIDR_SIZE:-256}
  MAX_IPS_PER_JOB: ${MAX_IPS_PER_JOB:-256}
  MAX_URLS_PER_CRAWL: ${MAX_URLS_PER_CRAWL:-1000}
  MAX_CRAWL_DEPTH: ${MAX_CRAWL_DEPTH:-3}
  MAX_SCAN_DURATION: ${MAX_SCAN_DURATION:-900}
  ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
  BB_REQUEST_HEADER: ${BB_REQUEST_HEADER:-}
  BB_USER_AGENT: "${BB_USER_AGENT:-bugbounty-platform/0.1.0 (authorized security testing)}"

# Bounded container logs for every service (structured JSON is also shipped as events).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-worker: &worker
  image: bugbounty/worker:${PLATFORM_VERSION:-0.1.0}
  restart: unless-stopped
  environment:
    <<: *platform-env
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
  networks: [backend]
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging: *default-logging
  mem_limit: ${WORKER_MEM_LIMIT:-768m}
  # On SIGTERM a worker stops taking new jobs and finishes the current one; give it time to do so.
  stop_grace_period: ${WORKER_STOP_GRACE:-180s}
  # Liveness: the worker loop touches this file at least every few seconds.
  healthcheck:
    test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker.alive')<120 else 1)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  # ---------------------------------------------------------------- data stores
  elasticsearch:
    logging: *default-logging
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      # Plain HTTP on the private compose network only (port bound to 127.0.0.1). See docs/deployment.md for TLS.
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.license.self_generated.type: basic
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
      cluster.routing.allocation.disk.watermark.low: ${ES_DISK_WATERMARK_LOW:-85%}
      cluster.routing.allocation.disk.watermark.high: ${ES_DISK_WATERMARK_HIGH:-90%}
      cluster.routing.allocation.disk.watermark.flood_stage: ${ES_DISK_WATERMARK_FLOOD:-95%}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: [esdata:/usr/share/elasticsearch/data]
    ports: ["127.0.0.1:${ES_PORT:-19200}:9200"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s

  es-setup:
    logging: *default-logging
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    restart: "no"
    entrypoint: ["bash", "/bb/scripts/bootstrap-elasticsearch.sh"]
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      LOGSTASH_WRITER_PASSWORD: ${LOGSTASH_WRITER_PASSWORD}
      ES_MONITOR_PASSWORD: ${ES_MONITOR_PASSWORD}
      ES_CONFIG_DIR: /bb/elasticsearch
    volumes:
      - ./scripts:/bb/scripts:ro
      - ./elasticsearch:/bb/elasticsearch:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [backend]

  kibana:
    logging: *default-logging
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION}
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
      TELEMETRY_OPTIN: "false"
      NODE_OPTIONS: --max-old-space-size=${KIBANA_NODE_MEMORY_MB:-1024}
    volumes: [kibanadata:/usr/share/kibana/data]
    ports: ["${KIBANA_BIND_HOST:-127.0.0.1}:${KIBANA_PORT:-15601}:5601"]
    depends_on:
      es-setup: { condition: service_completed_successfully }
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 60s

  kibana-setup:
    logging: *default-logging
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION}
    restart: "no"
    entrypoint: ["bash", "/bb/scripts/bootstrap-kibana.sh"]
    environment:
      KIBANA_URL: http://kibana:5601
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ./scripts:/bb/scripts:ro
      - ./kibana:/bb/kibana:ro
    depends_on:
      kibana: { condition: service_healthy }
    networks: [backend]

  logstash:
    logging: *default-logging
    image: docker.elastic.co/logstash/logstash:${LOGSTASH_VERSION}
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms${LOGSTASH_HEAP:-768m} -Xmx${LOGSTASH_HEAP:-768m}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LOGSTASH_WRITER_USER: logstash_writer
      LOGSTASH_WRITER_PASSWORD: ${LOGSTASH_WRITER_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./logstash/pipelines:/usr/share/logstash/pipeline:ro
      - logstashdata:/usr/share/logstash/data
    depends_on:
      es-setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600/_node/pipelines | grep -q '\"httpx\"'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  postgres:
    logging: *default-logging
    image: postgres:${POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    logging: *default-logging
    image: redis:${REDIS_VERSION}
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------- platform
  migrate:
    logging: *default-logging
    image: bugbounty/orchestrator:${PLATFORM_VERSION:-0.1.0}
    build: { context: ., dockerfile: apps/orchestrator/Dockerfile }
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *platform-env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  orchestrator:
    logging: *default-logging
    image: bugbounty/orchestrator:${PLATFORM_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      <<: *platform-env
      BB_SERVICE_NAME: orchestrator
      BB_BOOTSTRAP_ADMIN_KEY: ${BB_BOOTSTRAP_ADMIN_KEY}
      # channel secrets for `bbctl notify test` (same names as the notifier)
      NOTIFY_ALLOW_PRIVATE_DESTINATIONS: ${NOTIFY_ALLOW_PRIVATE_DESTINATIONS:-false}
      NOTIFY_SLACK_WEBHOOK: ${NOTIFY_SLACK_WEBHOOK:-}
      NOTIFY_DISCORD_WEBHOOK: ${NOTIFY_DISCORD_WEBHOOK:-}
      NOTIFY_TELEGRAM_TOKEN: ${NOTIFY_TELEGRAM_TOKEN:-}
      NOTIFY_WEBHOOK_SECRET: ${NOTIFY_WEBHOOK_SECRET:-}
      NOTIFY_SMTP_PASSWORD: ${NOTIFY_SMTP_PASSWORD:-}
    ports: ["${API_BIND_HOST:-127.0.0.1}:${API_PORT:-18000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  scheduler:
    logging: *default-logging
    image: bugbounty/orchestrator:${PLATFORM_VERSION:-0.1.0}
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler.service"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/scheduler.alive')<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      <<: *platform-env
      BB_SERVICE_NAME: scheduler
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  # ---------------------------------------------------------------- workers
  # Scale horizontally: docker compose up -d --scale httpx-worker=5
  httpx-worker:
    <<: *worker
    build:
      context: .
      dockerfile: workers/common/Dockerfile
      args:
        HTTPX_VERSION: ${HTTPX_VERSION}
        TLSX_VERSION: ${TLSX_VERSION}
        MAPCIDR_VERSION: ${MAPCIDR_VERSION}
        KATANA_VERSION: ${KATANA_VERSION}
        UNCOVER_VERSION: ${UNCOVER_VERSION}
        NUCLEI_VERSION: ${NUCLEI_VERSION}
        NUCLEI_TEMPLATES_VERSION: ${NUCLEI_TEMPLATES_VERSION:-10.4.9}
        NUCLEI_TEMPLATES_COMMIT: ${NUCLEI_TEMPLATES_COMMIT:-893122ffce8ebf8e264f15d2cd3960cb1dd36d6c}
    command: ["workers.httpx"]

  tlsx-worker:
    <<: *worker
    command: ["workers.tlsx"]

  # Template scanning. Templates are pinned in the image (tag + commit SHA verified at
  # build); OOB testing is disabled and hosts with URL exclusions are refused, not scanned.
  nuclei-worker:
    <<: *worker
    command: ["workers.nuclei"]

  dns-worker:
    <<: *worker
    command: ["workers.dns"]

  # Passive Certificate Transparency stream (no job queue; continuous). Reconnects with backoff.
  certstream-worker:
    <<: *worker
    command: ["workers.certstream"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/certstream.alive')<180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Optional self-hosted CT stream (the public calidog endpoint may accept connections but send
  # nothing). Enable with:  COMPOSE_PROFILES=ct-server  and  CERTSTREAM_URL=ws://certstream-server:8080/
  certstream-server:
    logging: *default-logging
    image: 0rickyy0/certstream-server-go:${CERTSTREAM_SERVER_VERSION:-v1.10.1}
    profiles: [ct-server]
    restart: unless-stopped
    volumes: [./configs/certstream/config.yaml:/app/config.yaml:ro]
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  mapcidr-worker:
    <<: *worker
    command: ["workers.mapcidr"]

  katana-worker:
    <<: *worker
    command: ["workers.katana"]

  # Search-engine discovery. Keys are read from the environment; engines without a key are skipped
  # and a job with no usable engine fails immediately (non-retryable).
  uncover-worker:
    <<: *worker
    command: ["workers.uncover"]
    environment:
      <<: *platform-env
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      CENSYS_API_TOKEN: ${CENSYS_API_TOKEN:-}
      CENSYS_ORGANIZATION_ID: ${CENSYS_ORGANIZATION_ID:-}
      FOFA_KEY: ${FOFA_KEY:-}
      NETLAS_API_KEY: ${NETLAS_API_KEY:-}
      ZOOMEYE_API_KEY: ${ZOOMEYE_API_KEY:-}

  # BBOT (passive+safe modules by default). Own image: BBOT's dependency pins differ from the platform's.
  bbot-worker:
    <<: *worker
    image: bugbounty/bbot-worker:${PLATFORM_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: workers/bbot/Dockerfile
      args:
        BBOT_VERSION: ${BBOT_VERSION}
    command: ["workers.bbot"]
    volumes: [bbothome:/home/bb]
    mem_limit: ${BBOT_MEM_LIMIT:-2g}
    stop_grace_period: ${BBOT_STOP_GRACE:-600s}

  # Vulnerability intelligence: CISA KEV, EPSS, NVD CPE correlation (feeds only; never scans).
  cve-monitor:
    <<: *worker
    command: ["workers.cve_monitor"]
    environment:
      <<: *platform-env
      NVD_API_KEY: ${NVD_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/cve.alive')<180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Event-driven notifications (Slack/Discord/Telegram/webhook/email). Never executes commands.
  notifier:
    <<: *worker
    command: ["workers.notifier"]
    environment:
      <<: *platform-env
      NOTIFY_RATE_PER_MINUTE: ${NOTIFY_RATE_PER_MINUTE:-20}
      NOTIFY_ALLOW_PRIVATE_DESTINATIONS: ${NOTIFY_ALLOW_PRIVATE_DESTINATIONS:-false}
      # Channel secrets are referenced by name (secret_ref); expose them here or as Docker secrets.
      NOTIFY_SLACK_WEBHOOK: ${NOTIFY_SLACK_WEBHOOK:-}
      NOTIFY_DISCORD_WEBHOOK: ${NOTIFY_DISCORD_WEBHOOK:-}
      NOTIFY_TELEGRAM_TOKEN: ${NOTIFY_TELEGRAM_TOKEN:-}
      NOTIFY_WEBHOOK_SECRET: ${NOTIFY_WEBHOOK_SECRET:-}
      NOTIFY_SMTP_PASSWORD: ${NOTIFY_SMTP_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/notifier.alive')<120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # TODO: nuclei-worker (phase 4). Provider IP ranges are
  # synced by the scheduler (no separate worker). Queues, policy schema, index templates and
  # Logstash pipelines exist; the adapters do not, so no container is defined (docs/scanner-workers.md).

networks:
  backend:
    name: bugbounty-backend

volumes:
  esdata:
  kibanadata:
  logstashdata:
  pgdata:
  redisdata:
  bbothome:
